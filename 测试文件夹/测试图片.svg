<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)"/>

  <!-- Glowing Sun / Circle -->
  <circle cx="400" cy="220" r="100" fill="url(#sunGrad)" filter="url(#glow)"/>

  <!-- Stars / Sparkles -->
  <g fill="#FFFFFF" opacity="0.8">
    <circle cx="160" cy="120" r="3"/>
    <circle cx="240" cy="80" r="2"/>
    <circle cx="620" cy="140" r="3"/>
    <circle cx="680" cy="90" r="2.5"/>
    <circle cx="120" cy="220" r="2"/>
    <circle cx="700" cy="260" r="3.5"/>
  </g>

  <!-- Mountain Silhouettes -->
  <path d="M -50 600 L 200 360 L 420 540 L 580 410 L 850 600 Z" fill="#1E1B4B" opacity="0.7"/>
  <path d="M 80 600 L 320 420 L 480 530 L 680 370 L 850 600 Z" fill="#0F172A" opacity="0.9"/>

  <!-- Card / Banner Overlay -->
  <rect x="200" y="460" width="400" height="90" rx="16" fill="rgba(255, 255, 255, 0.15)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5"/>

  <!-- Text -->
  <text x="400" y="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    Hello from Gemini! 🎨
  </text>
  <text x="400" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.8)" text-anchor="middle">
    Github MCP Test Image • agents-data-share
  </text>
</svg>
